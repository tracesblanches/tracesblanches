[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
# License still to be decided (F2, #2).

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# --- Internal crates (path dependencies, use `workspace = true`) ---
skimap-common = { path = "crates/common" }
skimap-osm = { path = "crates/osm" }
skimap-terrain = { path = "crates/terrain" }
skimap-snow = { path = "crates/snow" }
skimap-meteo = { path = "crates/meteo" }
skimap-zones = { path = "crates/zones" }
skimap-coverage = { path = "crates/coverage" }
skimap-refuges = { path = "crates/refuges" }
skimap-status = { path = "crates/status" }
skimap-avalanche = { path = "crates/avalanche" }
skimap-pack = { path = "crates/pack" }
skimap-core = { path = "crates/core" }
skimap-assist = { path = "crates/assist" }
skimap-voice = { path = "crates/voice" }

# --- Errors, logging ---
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# --- Serialisation and file formats ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
quick-xml = { version = "0.42.0", features = ["serialize"] }
csv = "1.4.0"
flate2 = "1.1.11"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.25.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
tiff = "0.11.3"
pmtiles = { version = "0.28.1", default-features = false, features = ["write"] }

# --- Geometry, CRS, spatial index, graphs ---
geo = "0.33.1"
geo-types = "0.7.20"
geojson = "1.0.0"
# Same major as geo 0.33 / geo-types 0.7 (their RTreeObject impls target rstar 0.12).
rstar = "0.12.2"
proj4rs = "0.3.0"
petgraph = "0.8.3"

# --- Time ---
chrono = { version = "0.4.45", features = ["serde"] }
httpdate = "1.0.3"

# --- Compute ---
rayon = "1.12.0"

# --- HTTP (blocking model, see docs/architecture.md) ---
# No default features: no aws-lc-rs (C build); the platform verifier (needs a JVM on
# Android) is never used: TLS is a preconfigured rustls client (ring + webpki-roots).
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "http2", "charset", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.12"
sha2 = "0.11.1"
hex = "0.4.3"

# --- CLI ---
clap = { version = "4.6.7", features = ["derive"] }

# --- Tests ---
approx = "0.5"
tempfile = "3.27.0"
tiny_http = "0.12.0"
