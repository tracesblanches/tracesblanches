[package]
name = "skimap-meteo"
description = "Client des API Météo-France : BERA par massif et météo horaire AROME (pipeline)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
skimap-common = { workspace = true, features = ["download"] }
skimap-core.workspace = true
chrono.workspace = true
# GRIB2 reader of the open Météo-France AROME packages (CCSDS packing, template 5.42), in
# pure Rust: not a workspace dependency yet (X17, #151).
grib = { version = "0.20.3", default-features = false, features = ["ccsds-unpack-with-rust-aec"] }
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
