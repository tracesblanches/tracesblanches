[package]
name = "skimap-cli"
description = "Binaire `skimap` : point d'entrée en ligne de commande du pipeline et des algorithmes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "skimap"
path = "src/main.rs"

[dependencies]
skimap-common = { workspace = true, features = ["download", "geotiff"] }
skimap-osm.workspace = true
skimap-terrain.workspace = true
skimap-snow.workspace = true
skimap-meteo.workspace = true
skimap-zones = { workspace = true, features = ["pipeline"] }
skimap-coverage.workspace = true
skimap-refuges.workspace = true
skimap-status.workspace = true
skimap-avalanche.workspace = true
# Pipeline side of the core: graph profiles from the terrain model, off-piste rasters.
skimap-core = { workspace = true, features = ["pipeline"] }
skimap-voice.workspace = true
skimap-assist.workspace = true
skimap-plan.workspace = true
skimap-pack = { workspace = true, features = ["pipeline"] }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
# `skimap fixtures` (Q1): gzip planet extract, manifest hashes.
flate2.workspace = true
sha2.workspace = true
hex.workspace = true

[lints]
workspace = true
