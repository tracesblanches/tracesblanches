[package]
name = "skimap-core"
description = "Noyau d'algorithmes partagé serveur / téléphone : routage, rattachement, hors piste, temps estimé, demi-tour, zones, batterie."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Pipeline side only: reads the 5 m terrain model and the snow rasters (GeoTIFF, through
# `skimap_common::geotiff`) to store an elevation profile on every edge of the trail graph
# (`routing::build`) and to prepare the off-piste rasters (`offpiste::prepare`). The phone
# never reads GeoTIFF: it loads the graph with its profiles and the SKR1 rasters. No HTTP
# stack either way.
pipeline = ["skimap-common/geotiff"]

[dependencies]
skimap-common = { workspace = true }
skimap-zones = { workspace = true }
chrono.workspace = true
rstar.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# Benchmarks (Q5, #105): instruction counts under Valgrind, gzipped inputs in benches/data.
gungraun.workspace = true
flate2.workspace = true

[[bench]]
name = "dominant"
harness = false

[[bench]]
name = "wall"
harness = false

[[bench]]
name = "make_data"
harness = false
required-features = ["pipeline"]

[[example]]
name = "routes"
required-features = ["pipeline"]

[[example]]
name = "matching_bench"
required-features = ["pipeline"]

[[example]]
name = "offpiste_bench"
required-features = ["pipeline"]

[lints]
workspace = true
