[package]
name = "skimap-ffi"
description = "Bibliothèque Android du noyau (UniFFI) : packs, styles validés instanciés sur les packs, synchro des packs, fiches FR/EN, catalogue des domaines, zones de redevance (K1, K15, K2, H2, VO6) ; matin, plan de journée et suivi de la sortie (J5, K4, K5, K9, C11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib: libskimap_ffi.so loaded by the Android app (JNA); lib: tests and examples.
crate-type = ["cdylib", "lib"]
name = "skimap_ffi"

[dependencies]
skimap-pack = { workspace = true }
# Day plan and tracking (K4, K5, K9, J5, C11): the phone-side crates, no HTTP stack.
skimap-plan.workspace = true
skimap-assist.workspace = true
skimap-core.workspace = true
skimap-common.workspace = true
skimap-voice.workspace = true
# « Mes sorties », challenges, Strava export, OSM notes (V12, V13, V15): phone side.
skimap-collab = { path = "../collab", features = ["phone"] }
# Off-piste in the app (V1), rules of a place (V6), low-exposure zones (V7): the zone layer
# and rules, the SRN difficulty (not in [workspace.dependencies]: no other crate depends
# on it) and the gzip of the off-piste rasters of the packs.
skimap-zones.workspace = true
skimap-srndiff = { path = "../srndiff" }
flate2.workspace = true
chrono.workspace = true
geojson.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Not in [workspace.dependencies] (only this crate uses it). Same version as the binding
# generator of the app (android/uniffi-bindgen), outside the workspace.
uniffi = "=0.32.2"

[dev-dependencies]
# Test pack generator (example `test_pack`): the pack builder of the pipeline, offline.
skimap-pack = { workspace = true, features = ["pipeline"] }
skimap-common = { workspace = true, features = ["download"] }
pmtiles.workspace = true
geo.workspace = true
chrono.workspace = true
flate2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
