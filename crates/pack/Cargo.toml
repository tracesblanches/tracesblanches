[package]
name = "skimap-pack"
description = "Format de pack par site (écriture côté pipeline, lecture côté téléphone), fond de carte, visualiseur, export Locus Map / OsmAnd."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Pack builder, basemap download (P4) and Locus Map / OsmAnd export (P21). Without it the
# crate is the phone-side reader: no HTTP stack, no SQLite (`cargo tree -p skimap-pack`).
pipeline = [
    "skimap-common/download",
    "skimap-common/geotiff",
    "dep:skimap-terrain",
    "dep:skimap-zones",
    "dep:skimap-core",
    "dep:skimap-assist",
    "dep:skimap-plan",
    "dep:chrono",
    "dep:rayon",
    "dep:rusqlite",
    "dep:tracing",
]

[dependencies]
skimap-common = { workspace = true }
flate2.workspace = true
geojson.workspace = true
hex.workspace = true
pmtiles.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Pipeline only.
skimap-terrain = { workspace = true, optional = true }
skimap-zones = { workspace = true, optional = true }
# Refuges of the day plan flagged in the pack (X21, #155).
skimap-core = { workspace = true, optional = true }
# The starts of the site ranked by the planner on the pack (#166): the phone's morning.
skimap-assist = { workspace = true, optional = true }
skimap-plan = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
# Name clip ids and the voice list of personal sources, for the checks of the published voice.
skimap-voice.workspace = true

