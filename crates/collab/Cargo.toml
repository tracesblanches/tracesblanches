[package]
name = "skimap-collab"
description = "Collaboratif et sport (V8 à V15) : règles des signalements (types, durées de vie, confirmations, réputation), stockage SQLite du serveur, photos sans métadonnées ; côté téléphone, défis calculés sur les sorties, import de l'export Strava, brouillon de note OSM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Server side: the SQLite store of the reports (skimap-server).
server = ["dep:rusqlite", "dep:sha2", "dep:hex"]
# Phone side (skimap-ffi): Strava export archive, tracks, challenges, calibration input.
phone = ["dep:zip", "dep:flate2", "dep:quick-xml", "dep:csv", "dep:skimap-core"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
# Time model C5 and the calibration input (OutingObs): phone side, no HTTP stack.
skimap-core = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
flate2.workspace = true
skimap-core.workspace = true

[[example]]
name = "challenge_assets"
required-features = ["phone"]

[lints]
workspace = true
