[package]
name = "skimap-assist"
description = "Assistant : briefing, fartage, qualité de neige, affluence, suggestions, équipement, synthèse, alertes, meilleur moment, bilan, questions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Runs on the phone: no `download` feature of skimap-common, no HTTP stack. The assistant
# only reads the layer outputs in data/out/<site>/ (`cargo tree -p skimap-assist -e normal`).
[dependencies]
skimap-common = { workspace = true, features = ["geotiff"] }
skimap-core.workspace = true
skimap-zones.workspace = true
skimap-voice.workspace = true
jiff.workspace = true
geo.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# UInt8 class GeoTIFF of the avalanche exposure (common reads Float32 only); pure Rust.

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
