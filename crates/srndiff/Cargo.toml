[package]
name = "skimap-srndiff"
description = "Difficulté d'un tracé de ski de randonnée nordique (SRN) : profils le long du tracé, niveau, raisons et conseils dans les deux sens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Pipeline side only (calibration and evaluation): LiDAR HD terrain and canopy along a
# narrow corridor through the shared downloader, the avalanche exposure model on the
# corridor, published references (GPX, ratings), roads from the IGN BD TOPO. The computation
# itself (profile, rules, advice, text) never needs it and builds for Android.
pipeline = [
    "dep:skimap-terrain",
    "dep:skimap-avalanche",
    "dep:skimap-srn",
    "dep:rayon",
    "dep:tracing",
    "skimap-common/download",
    "skimap-common/geotiff",
]

[dependencies]
skimap-common = { workspace = true }
skimap-core = { workspace = true }
skimap-zones = { workspace = true }
chrono.workspace = true
geo.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
skimap-terrain = { workspace = true, optional = true }
skimap-avalanche = { workspace = true, optional = true }
# For its GPX reader only.
skimap-srn = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true

[[example]]
name = "srndiff"
required-features = ["pipeline"]

[lints]
workspace = true
