# Supply chain checks of the workspace (Q6, #106): `cargo deny check` (CI job `deny`).
#
# - advisories: RustSec database, every advisory (vulnerability, unmaintained, unsound)
#   and yanked crates are errors; an exception goes in `ignore` with its reason;
# - licenses: third-party crates under permissive licences only, all compatible with the
#   GPL-3.0-or-later of the code (F2, #2, docs/licences/f2-licence-code.md) and with
#   distributing the Android binary; the workspace crates are checked too (`private`
#   below): each must declare its licence, GPL-3.0-or-later, except skimap-avalanche
#   (EUPL-1.2, port of com4FlowPy);
# - bans: no wildcard version requirements; duplicate versions are reported, not denied
#   (the tree has several through geo / reqwest / zip); only skimap-cli and skimap-srndiff
#   (its `pipeline` feature) may depend on skimap-avalanche, so its EUPL-1.2 code stays on
#   the pipeline side;
# - sources: crates.io only; the patched pmtiles (vendor/pmtiles, MIT OR Apache-2.0) is a
#   path dependency.
#
# The licences of the data (ODbL, Licence Ouverte, CC BY-SA, EUPL / CeCILL-C of some
# sources) are documented in docs/licences-donnees.md: they do not concern the crates.
#
# The Android library is checked on its own graph by deny-phone.toml (skimap-ffi with its
# default features, Android targets): it must not contain skimap-avalanche at all, even
# through skimap-srndiff, nor any crate under the EUPL-1.2.

[graph]
# Every feature of the workspace crates (pipeline, download, geotiff): the pipeline and
# the phone dependencies are both checked.
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Mozilla root certificates (webpki-roots, webpki-root-certs): permissive data licence.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # UniFFI runtime (uniffi_* crates, Android bindings): file-level copyleft, unmodified sources;
    # compatible with GPL-3.0-or-later as a "Secondary License" (MPL-2.0 section 3.3).
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # libbz2-rs-sys (zip archives): the BSD-style licence of bzip2 1.0.6.
    "bzip2-1.0.6",
]
confidence-threshold = 0.93
# Workspace crates are unpublished (`publish = false`) but checked: a crate without a
# `license` field fails here.
private = { ignore = false }
# The licences of the code itself, never allowed for a third-party crate.
exceptions = [
    { crate = "skimap-assist", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-avalanche", allow = ["EUPL-1.2"] },
    { crate = "skimap-cli", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-collab", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-common", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-core", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-coverage", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-deps", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-ffi", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-group", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-intent", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-meteo", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-osm", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-pack", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-pisteplan", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-plan", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-refuges", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-server", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-snow", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-srn", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-srndiff", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-stations", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-status", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-styles", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-terrain", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-voice", allow = ["GPL-3.0-or-later"] },
    { crate = "skimap-zones", allow = ["GPL-3.0-or-later"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies (`workspace = true`, vendor/pmtiles) have no version requirement.
allow-wildcard-paths = true
deny = [
    # EUPL-1.2 code (port of com4FlowPy): pipeline side only (F2, #2).
    { crate = "skimap-avalanche", wrappers = ["skimap-cli", "skimap-srndiff"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
