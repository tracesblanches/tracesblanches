# Weekly real build of both sites (Q6, #106): `skimap build-all` with fresh downloads from
# every source (empty cache), then the reference tests of the real sites (Q2: the
# `real_sites` tests of the crates and the reading of the built packs), the RustSec
# advisories, and the logs and layer metadata as artifacts.
#
# Duration: build-all is 99 s at Cervières and 22 s at Chapelle-des-Bois on the workstation
# with a filled cache; here the downloads dominate (ARCEP coverage archives, about 4 GB;
# LiDAR HD tiles at 20 requests/s; OpenSnowMap extract): estimated 30 to 60 min.
#
# Sources for personal use only (Nordic France widget, Open-Meteo, ENJ, mairie de
# Cervières) are not used: SKIMAP_PERSONAL_SOURCES is not set (docs/architecture/
# donnees.md); `meteo` and `status-poll` are skipped. The Météo-France key (BERA of the
# Queyras) comes from the secret METEOFRANCE_API_KEY of the `weekly-build-all`
# environment, given to the build step only; the code never prints it
# (common::config::Secret prints ***) and GitHub masks it.
name: Weekly build-all

on:
  schedule:
    # Mondays 03:17 UTC (the OpenSnowMap extract is rebuilt daily around 03:30 UTC, the
    # day before is used).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-build-all
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-all:
    name: build-all (Cervières, Chapelle-des-Bois)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # The Météo-France key is an environment secret of `weekly-build-all` (Settings →
    # Environments), so that only this job, from the default branch, can read it.
    environment: weekly-build-all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disk space for the downloads (about 6 GB of cache, 1 GB of outputs)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p skimap-cli
      - name: build-all cervieres
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          SKIMAP_DATA_DIR: ${{ github.workspace }}/data
          RUST_LOG: warn
        run: |
          mkdir -p logs
          set -o pipefail
          target/release/skimap build-all cervieres 2>&1 | tee logs/build-all-cervieres.log
      - name: build-all chapelle-des-bois
        if: success() || failure()
        env:
          SKIMAP_DATA_DIR: ${{ github.workspace }}/data
          RUST_LOG: warn
        run: |
          set -o pipefail
          target/release/skimap build-all chapelle-des-bois 2>&1 | tee logs/build-all-chapelle-des-bois.log
      - name: Reference tests of the real sites (Q2)
        env:
          SKIMAP_DATA_DIR: ${{ github.workspace }}/data
        run: >-
          cargo test --release --locked --workspace --all-features
          --test real_sites --test real_packs -- --ignored
      - name: Layer metadata
        if: success() || failure()
        run: |
          mkdir -p logs/meta
          find data/out -name '*.meta.json' -exec cp --parents {} logs/meta/ \;
          du -sh data/cache data/out | tee logs/sizes.txt
      - if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-all-logs
          path: logs
          retention-days: 30

  deny:
    name: cargo deny (advisories of the week)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories
