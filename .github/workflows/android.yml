# CI de l'app Android (K1 #51, K12 #115, K15 #123, K2 #52, Q8 #108) : compilation (Rust par
# cargo-ndk dans Gradle), tests JVM et Compose (dont la synchro contre skimap-server), captures
# comparées aux références (Roborazzi), lint Android sans avertissement, detekt, ktlint, puis
# test instrumenté sur émulateur avec le pack de test et un skimap-server local (téléchargement,
# mise à jour différentielle, mode avion).
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "crates/**", "styles/**", "vendor/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "crates/**", "styles/**", "vendor/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2

jobs:
  build:
    name: build, tests, captures, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Rust toolchain (rust-toolchain.toml) and Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-ndk and NDK
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # build: assemble (debug, release with R8), JVM and Compose tests, Android lint
      # (warnings are errors); verifyRoborazziDebug: captures against src/test/screenshots.
      - name: Gradle build, captures, detekt, ktlint
        run: ./gradlew build verifyRoborazziDebug detekt ktlintCheck --stacktrace
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/roborazzi/

  instrumented:
    name: instrumented test (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Rust toolchain (rust-toolchain.toml) and Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-ndk and NDK
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the app, its test APK, the test store and skimap-server
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testStore :app:cargoServer
      # The download tests reach it from the emulator at 10.0.2.2:8787; it stays up for the
      # next steps (background process of the job).
      - name: Start the local skimap-server (test store)
        working-directory: android
        run: |
          SKIMAP_STORE="$PWD/app/build/generated/testStore" SKIMAP_SERVER_DB="$RUNNER_TEMP/skimap.sqlite" \
          SKIMAP_CONTACT_EMAIL=ci@example.org \
            nohup app/build/rust/server/skimap-server serve --addr 127.0.0.1:8787 > "$RUNNER_TEMP/skimap-server.log" 2>&1 &
          for _ in $(seq 1 50); do curl -sf http://127.0.0.1:8787/healthz && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8787/v1/catalog.json > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The synthetic test pack is in the test APK; the real packs are not in the
      # repository, so the real-pack tests of PackDisplayTest are skipped here.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_8
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.skimapServer=http://10.0.2.2:8787
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-reports
          path: |
            android/app/build/reports/androidTests/
            ${{ runner.temp }}/skimap-server.log
