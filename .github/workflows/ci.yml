# CI of the Rust workspace (F1 #1, F4 #4, Q3 #103, Q5 #105, Q6 #106).
#
# Jobs (in parallel; measured or estimated time on a 4-vCPU ubuntu runner with a warm
# cache, cold cache in brackets):
#   fmt          rustfmt on the workspace and the fuzz crate                   ~0.5 min
#   clippy       -D warnings, all targets, with and without `pipeline`       ~3 min (8)
#   test         workspace tests, phone crates without `pipeline`, no HTTP    ~4 min (9)
#   doc          cargo doc -D warnings (workspace, pipeline variants)         ~2 min (5)
#   deny         licences, RustSec advisories, sources (deny.toml)            ~1 min
#   properties   proptest properties, 16 384 cases each, release              ~3 min (6)
#   fuzz         corpus replay (stable), then 60 s per target under ASan      ~6 min (10)
#   bench        instruction counts, base vs head on the same runner          ~8 min (14)
#   workflows    actionlint, zizmor, no unpublishable data in versioned files   ~0.5 min
#   android      skimap for aarch64-linux-android (NDK of the runner)         ~4 min (9)
# Wall time ≈ the longest job (bench), ~8 to 14 min; runner time ≈ 32 to 66 min.
#
# Toolchain from rust-toolchain.toml (pinned 1.99.1, rustfmt, clippy, Android target);
# nightly pinned for cargo-fuzz only. Every action is pinned by commit SHA (version in the
# comment). No secret is used here; the weekly build-all (weekly.yml) uses one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Pipeline side of the core (GeoTIFF reading, graph profiles, off-piste rasters) and
      # of the pack (builder, export), with their examples and benches.
      - run: cargo clippy -p skimap-core --features pipeline --all-targets --locked -- -D warnings
      - run: cargo clippy -p skimap-pack --features pipeline --all-targets --locked -- -D warnings
      # Fuzz harness and corpus replay (stable; the fuzzing itself is in the fuzz job).
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Unit, integration, property (256 cases) and doc tests; features unified across the
      # workspace (the CLI enables the pipeline side of every crate).
      - run: cargo test --workspace --locked
      # Crates that run on the phone, alone: without the `pipeline` feature, without the
      # downloader.
      - run: cargo test --locked -p skimap-common -p skimap-core -p skimap-assist -p skimap-voice -p skimap-pack
      - name: No HTTP stack nor SQLite on the phone side
        run: |
          tree=$(cargo tree --locked -e normal -p skimap-core -p skimap-assist -p skimap-voice -p skimap-pack)
          if grep -E '(reqwest|hyper|rustls|rusqlite) v' <<<"$tree"; then
            echo "::error::the phone crates link an HTTP stack or SQLite"
            exit 1
          fi
      - run: cargo test -p skimap-common --features geotiff --locked
      - run: cargo test -p skimap-core --features pipeline --locked
      - run: cargo test -p skimap-pack --features pipeline --locked

  doc:
    name: cargo doc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo doc -p skimap-core --features pipeline --no-deps --locked
      - run: cargo doc -p skimap-pack --features pipeline --no-deps --locked
      - run: cargo test --workspace --doc --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      # Fetches the RustSec advisory database: a new advisory fails the job even without
      # a change in the repository (also run weekly, weekly.yml).
      - run: cargo deny --locked check

  properties:
    name: property tests (16 384 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROPTEST_CASES: "16384"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Properties (Q3, #103)
        run: >-
          cargo test --release --locked
          -p skimap-core -p skimap-zones -p skimap-avalanche -p skimap-common
          -p skimap-snow -p skimap-voice -p skimap-pack
          --features skimap-common/geotiff
          --test prop_graph --test prop_offpiste --test prop_geom --test prop_clip
          --test prop_common --test prop_projection --test prop_rounding --test prop_png_tiles

  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Nightly lints of the day must not fail the fuzz build.
      RUSTFLAGS: ""
      FUZZ_TOOLCHAIN: nightly-2026-10-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchains (pinned stable, pinned nightly)
        run: |
          rustup toolchain install
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Replay seeds, regressions and corpus (stable, no sanitizer)
        run: cargo test --manifest-path fuzz/Cargo.toml --release --locked
      - name: cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-fuzz
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Inputs found by earlier runs, on top of the versioned corpus.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/work
          key: fuzz-work-${{ github.run_id }}
          restore-keys: fuzz-work-
      - name: Replay under ASan, then 60 s per target
        run: fuzz/ci.sh 60 "$(nproc)"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts
            fuzz/logs

  bench:
    name: benchmarks (instruction counts)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base revision is benchmarked too.
          fetch-depth: 0
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind libc6-dbg
          valgrind --version
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: gungraun-runner@0.20.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Base vs head (fails on +5 % instructions)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            benches/compare.sh "$BASE" 5%
          else
            echo "no base revision: measuring the head only"
            cargo bench --locked -p skimap-core --bench dominant -p skimap-avalanche --bench exposure
          fi

  workflows:
    name: actionlint, zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12 (release archive, checked against its SHA-256)
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: zizmor@1.32.0
      - run: zizmor --offline .github/workflows
      # No versioned data (bench inputs, fuzz seeds, regressions, corpus) from a source
      # that may not be published (Biodiv'sports zones, CLPA map).
      - name: Publishable data only
        run: .github/scripts/check-unpublishable-data.sh

  android:
    name: build skimap (aarch64-linux-android)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}
      - if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build
        # The runner image ships an NDK; ANDROID_NDK_LATEST_HOME points to it.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a --platform 34 build --release --locked -p skimap-cli
          file target/aarch64-linux-android/release/skimap
