# Tickets skimap — source pour la création des issues GitHub.
# key : identifiant local stable ; deps : clés des tickets qui bloquent celui-ci.
# Références : research/etat-des-lieux.md (doc), research/features.md (n° de fonction F#), research/reports/.

milestones:
  - M0 Fondations
  - M1 Preuve Rust
  - M2 Terrain hiver 2026-27
  - M3 Client v1
  - M4 v2
  - M5 v3

labels:
  type: [recherche, juridique, preuve, pipeline, algo, terrain, client, serveur, décision, infra]
  thème: [carte, sécurité, planifier, pendant, collaboratif, sport]
  version: [v1, v2, v3]

tickets:

# ---------- M0 Fondations ----------
- key: F1
  title: Workspace Rust du dépôt et CI
  milestone: M0 Fondations
  labels: [infra]
  deps: []
  body: |
    Workspace cargo avec crates `pipeline` (traitement des données), `core` (algorithmes partagés serveur / téléphone), `tools` (visualisation, bancs d'essai).
    CI GitHub Actions : fmt, clippy -D warnings, tests.
    Critère : `cargo test` et la CI passent sur une PR de démonstration.

- key: F2
  title: Choisir la licence du dépôt
  milestone: M0 Fondations
  labels: [décision]
  deps: [L3]
  body: |
    Le dépôt deviendra probablement public. Choisir la licence du code et celle des données dérivées (contraintes ODbL d'OSM, CC BY-SA de refuges.info et Camptocamp).
    Critère : fichier LICENSE et section licence des données dans le README.

- key: F3
  title: Inventaire du Pixel 8 Pro par adb
  milestone: M0 Fondations
  labels: [preuve, pendant]
  deps: []
  body: |
    Lecture seule par adb : capteurs (baromètre, magnétomètre, fréquence max de l'accéléromètre et du gyroscope), capacités GNSS (bi-fréquence L5 ?), voix TTS française hors ligne installée, reconnaissance vocale hors ligne disponible, état batterie.
    Critère : rapport `research/reports/08-inventaire-pixel.md` avec les sorties de commandes. Lève les « à tester » correspondants du doc.

- key: F4
  title: Chaîne de compilation Rust pour Android
  milestone: M0 Fondations
  labels: [infra]
  deps: [F1]
  body: |
    Installer la cible `aarch64-linux-android` et `cargo-ndk` (NDK 28.2 déjà présent). Compiler un binaire de démonstration et l'exécuter sur le Pixel par `adb shell`.
    Critère : sortie du binaire exécuté sur le Pixel collée dans le ticket.

- key: R1
  title: Rapport recensement des domaines et zones avalanche (rapport 07)
  milestone: M0 Fondations
  labels: [recherche, carte, sécurité]
  deps: []
  body: |
    Recherche en cours : sources et nombre de domaines de fond (France, monde, OpenSkiMap), définition ATES classe 0, auto-ATES / Flow-Py, LiDAR HD, CLPA / EPA, formulation juridique.
    Critère : `research/reports/07-recensement-et-avalanche.md` versé et résumé dans le doc.

# ---------- Juridique ----------
- key: L1
  title: Licence de l'API Snowmap de l'Espace Nordique Jurassien
  milestone: M0 Fondations
  labels: [juridique, carte]
  deps: []
  body: |
    L'API Geotrek ENJ (ouvert / fermé par piste dans le champ `route`, GPX) n'affiche aucune licence. Demander par écrit à l'ENJ l'autorisation de réutilisation et ses conditions.
    Critère : réponse écrite archivée.

- key: L2
  title: Conditions IGN pour le hors ligne (Plan IGN v2, carte des pentes)
  milestone: M0 Fondations
  labels: [juridique, carte]
  deps: []
  body: |
    Confirmer que le préchargement et la redistribution en pack hors ligne du Plan IGN v2 vectoriel et de la couche `SLOPES.MOUNTAIN` sont permis (Etalab 2.0 ?), et la mention d'attribution exigée.
    Critère : texte ou réponse IGN citant la règle applicable.

- key: L3
  title: Compatibilité des licences de données (ODbL, CC BY-SA, Licence Ouverte)
  milestone: M0 Fondations
  labels: [juridique]
  deps: []
  body: |
    OSM (ODbL), refuges.info et Camptocamp (CC BY-SA), DATAtourisme et Météo-France (Licence Ouverte). Définir comment les combiner sans créer d'œuvre dérivée incompatible (couches séparées, attributions).
    Critère : note de décision dans `docs/licences-donnees.md`.

- key: L4
  title: Convention avec Nordic France pour l'état des pistes
  milestone: M2 Terrain hiver 2026-27
  labels: [juridique, carte]
  deps: []
  body: |
    Le bulletin Nordic France (ouvert / fermé par piste, dernier damage) n'a pas d'API publique. Demander un accès ou une convention, d'abord pour Cervières.
    Critère : réponse écrite ; si refus, l'app affiche un lien vers le bulletin.

- key: L5
  title: Strava — OAuth et import d'historique
  milestone: M0 Fondations
  labels: [juridique, sport]
  deps: []
  body: |
    Vérifier si l'OAuth Strava impose un secret client côté serveur (pas de PKCE ?). Valider l'interprétation : import par l'utilisateur de son export Strava (politique 6.6) au lieu de l'API (interdictions 5.3, 5.4, 5.5, 6.2).
    Critère : note avec citations des clauses en vigueur.

- key: L6
  title: Licences des sources de zones et de neige (Biodiv'sports, GPU, Theia)
  milestone: M0 Fondations
  labels: [juridique, sécurité]
  deps: []
  body: |
    Confirmer les licences de Biodiv'sports, des servitudes du Géoportail de l'urbanisme, des produits Theia Neige.
    Critère : tableau des licences dans `docs/licences-donnees.md`.

- key: L7
  title: Licences des topos SRN (skirandonneenordique.com, GTJ, Skitour)
  milestone: M4 v2
  labels: [juridique, planifier]
  deps: []
  body: |
    skirandonneenordique.com n'a ni API ni licence affichée ; Skitour est en CC BY-SA avec clé ; GTJ à vérifier (gtj.asso.fr en 403). Demander les autorisations.
    Critère : réponses archivées.

- key: L8
  title: Accord éventuel avec Skitourenguru
  milestone: M4 v2
  labels: [juridique, sécurité]
  deps: [R1]
  body: |
    Aucune licence ouverte. Évaluer l'intérêt d'un accord (157 itinéraires autour de Cervières, aucun dans le Jura) face au calcul maison.
    Critère : décision documentée.

# ---------- M1 Preuve Rust : pipeline ----------
- key: P1
  title: Téléchargeur commun des sources (cache, ETag, quotas)
  milestone: M1 Preuve Rust
  labels: [pipeline]
  deps: [F1]
  body: |
    Module de téléchargement réutilisable : cache disque, ETag / If-Modified-Since, limites de débit par source (Overpass, Biodiv'sports, DATAtourisme 1000 req/h, Skitour 1000 req/jour), User-Agent générique.
    Critère : tests avec un serveur local ; aucune requête répétée inutile.

- key: P2
  title: Extraction des pistes nordiques OSM
  milestone: M1 Preuve Rust
  labels: [pipeline, carte]
  deps: [P1]
  body: |
    Depuis `planet_pistes.osm.gz` d'OpenSnowMap : ways et relations `piste:type=nordic` (et `hike`), nom et couleur depuis les relations (la difficulté des ways est incohérente), `piste:grooming`, `piste:oneway`.
    Critère : GeoJSON et graphe pour Cervières et Chapelle-des-Bois ; comptes comparés au rapport 02 (Chapelle : 13 pistes sur 13 présentes).

- key: P3
  title: Recensement et délimitation des domaines de fond
  milestone: M1 Preuve Rust
  labels: [pipeline, carte]
  deps: [P2, R1]
  body: |
    Regrouper les pistes en domaines (méthode OpenSkiMap ou équivalente), rapprocher des domaines Nordic France / SkiRadar pour les noms. France d'abord.
    Critère : liste des domaines France avec géométrie, nom, km ; taux de rapprochement mesuré.
    OpenSkiMap fusionne Cervières dans « Queyras - Arvieux » (regroupement à 0,5 km par le col d'Izoard) : faire notre propre regroupement, sans traverser un col (rapport 07).

- key: P4
  title: Fond de carte par site (Plan IGN v2 + PMTiles OSM)
  milestone: M1 Preuve Rust
  labels: [pipeline, carte]
  deps: [P1, L2]
  body: |
    Extraire un PMTiles Protomaps par site et le style Plan IGN v2 vectoriel. Taille par site mesurée.
    Critère : affichage dans le visualiseur (P15) hors ligne.

- key: P5
  title: Relief IGN par zone et pentes
  milestone: M1 Preuve Rust
  labels: [pipeline, sécurité]
  deps: [P1]
  body: |
    Télécharger le relief IGN (RGE ALTI 5 m ou LiDAR HD) sur les deux zones ; calculer pente et orientation ; comparer à la couche `SLOPES.MOUNTAIN`.
    Critère : écart mesuré entre pente calculée et couche IGN.

- key: P6
  title: Carte d'enneigement estimée (simulation Météo-France projetée sur le relief)
  milestone: M1 Preuve Rust
  labels: [pipeline, carte]
  deps: [P1, P5]
  body: |
    Pour chaque pixel : massif, altitude, orientation, pente → hauteur interpolée depuis la simulation nivologique J-1 (massifs 17 Queyras, 55/56 Haut-Doubs / Haut-Jura). Trois classes par pratique + fourchette.
    Critère : couche quotidienne pour les deux sites ; massif SAFRAN de Chapelle-des-Bois confirmé.

- key: P7
  title: Valider la carte de neige contre les stations
  milestone: M1 Preuve Rust
  labels: [preuve, carte]
  deps: [P6]
  body: |
    Comparer l'estimation aux stations Météo-France (Cervières 1614 m, Arvieux, Mouthe, La Boissaude) sur une saison passée.
    Critère : biais et erreur moyenne par site publiés dans un rapport.

- key: P8
  title: BERA par massif
  milestone: M1 Preuve Rust
  labels: [pipeline, sécurité]
  deps: [P1]
  body: |
    Client API Météo-France (compte gratuit), lecture du XML, extraction du massif Queyras. Jura : messages d'avertissement Météo-France et lien SLF.
    Critère : BERA du jour stocké en fichier statique.

- key: P9
  title: Zones protégées et périodes
  milestone: M1 Preuve Rust
  labels: [pipeline, sécurité]
  deps: [P1, L6]
  body: |
    INPN WFS (`patrinat_*`), servitudes GPU (sites inscrits / classés, SPR, monuments, captages), Biodiv'sports avec `period` (sinon seulement le mois courant). Suisse : districts francs (geo.admin).
    Critère : couche unique avec périodes ; APPB Haut-Jura et Haut-Doubs présents.

- key: P10
  title: Règles de bivouac et d'accès saisies depuis les arrêtés
  milestone: M1 Preuve Rust
  labels: [pipeline, sécurité]
  deps: [P9]
  body: |
    Schéma de règles (période, interdiction de sortir des itinéraires, bivouac, feu, accès de nuit, zones cœur) et saisie pour les deux sites depuis les textes primaires (APPB, arrêtés communaux, R111-33).
    Critère : fichier de règles sourcé, chaque règle avec son URL.

- key: P11
  title: Refuges et abris (refuges.info, OSM, Camptocamp)
  milestone: M1 Preuve Rust
  labels: [pipeline, carte]
  deps: [P1, L3]
  body: |
    Fusion par `ref:refuges.info`, capacité hors gardiennage depuis Camptocamp, dernier commentaire daté ; couches séparées selon la licence.
    Critère : couche par site avec attributions.

- key: P12
  title: Zones sans aucun réseau (ARCEP)
  milestone: M1 Preuve Rust
  labels: [pipeline, sécurité]
  deps: [P1]
  body: |
    Union des couvertures voix des 4 opérateurs, différence avec la zone : polygones « aucun réseau, même 112 ». Recalcul trimestriel.
    Critère : chiffres cohérents avec le rapport 06 (Cervières 51 km², Chapelle 18 km²).

- key: P13
  title: Instantané de l'état des pistes ENJ
  milestone: M1 Preuve Rust
  labels: [pipeline, carte]
  deps: [P1, L1]
  body: |
    Interrogation planifiée de l'API ENJ (champ `route` : 1 Fermé, 2 Ouvert ; `labels`), une fois pour tous les utilisateurs.
    Critère : historique d'une semaine en saison et fréquence de mise à jour observée.

- key: P14
  title: Format de pack par site
  milestone: M1 Preuve Rust
  labels: [pipeline]
  deps: [P2, P4, P5, P6, P9, P11, P12, P13]
  body: |
    Pack versionné : PMTiles, GeoJSON des couches, métadonnées (dates, sources, attributions). Lecture par le noyau Rust.
    Critère : pack Cervières et Chapelle-des-Bois générés ; taille mesurée.

- key: P15
  title: Visualiseur web des packs
  milestone: M1 Preuve Rust
  labels: [pipeline]
  deps: [P14]
  body: |
    Page MapLibre GL JS locale qui affiche toutes les couches d'un pack, pour juger les résultats à l'œil.
    Critère : les deux sites visibles avec toutes les couches.

- key: P16
  title: Exposition aux avalanches — référence auto-ATES sur Cervières
  milestone: M1 Preuve Rust
  labels: [preuve, sécurité]
  deps: [P5, R1]
  body: |
    Faire tourner l'implémentation de référence (auto-ATES, GPL) sur la zone de Cervières comme oracle : zones de départ, zones d'arrivée, classe terrain non avalancheux.
    Critère : couche de référence et temps de calcul mesuré.

- key: P17
  title: Exposition aux avalanches en Rust
  milestone: M1 Preuve Rust
  labels: [algo, sécurité]
  deps: [P16]
  body: |
    Réimplémentation en Rust (zones de départ, écoulement, forêt), comparée à l'oracle P16.
    Critère : accord mesuré avec P16 ; temps de calcul sur la zone ; jamais formulé « sans danger ».

- key: P18
  title: Valider l'exposition aux avalanches contre CLPA / EPA
  milestone: M1 Preuve Rust
  labels: [preuve, sécurité]
  deps: [P17, P20]
  body: |
    Comparer les zones calculées aux avalanches connues (CLPA, EPA) sur le Queyras.
    Critère : taux d'avalanches connues tombant en terrain classé non avalancheux (objectif : aucune).

- key: P19
  title: Météo heure par heure par site (AROME)
  milestone: M1 Preuve Rust
  labels: [pipeline, planifier]
  deps: [P1]
  body: |
    Vent, température ressentie, visibilité / brouillard, isotherme 0 °C, chutes de neige prévues, depuis l'API Météo-France.
    Critère : fichier statique par site mis à jour à chaque run.

- key: P20
  title: Avalanches historiques (CLPA republiée par la DDT 05) et alerte par tronçon
  milestone: M1 Preuve Rust
  labels: [pipeline, sécurité]
  deps: [P1, P2]
  body: |
    La CLPA d'INRAE est limitée à « un usage personnel » ; la DDT des Hautes-Alpes la republie en Licence Ouverte (droit de republication à confirmer). Cervières : 171 emprises ; 5,8 km des 34,5 km du réseau nordique les traversent (liaison Le Laus – Les Fonts, Chemin du Sioux, Le Cancel, Izoard). Source : research/reports/07-recensement-et-avalanche.md.
    Couche des emprises + liste des tronçons de pistes et d'itinéraires qui les traversent, croisée avec le BERA Queyras pour l'alerte. Le Jura n'a ni CLPA ni BERA.
    Critère : longueurs recalculées et cohérentes avec le rapport 07.

- key: P21
  title: Export des couches pour Locus Map et OsmAnd
  milestone: M1 Preuve Rust
  labels: [pipeline, carte]
  deps: [P14]
  body: |
    Rendre la preuve de concept utile dès l'hiver 2026-27, avant le client Kotlin : exporter les couches d'un pack dans des formats que Locus Map et OsmAnd lisent hors ligne sur le Pixel.

    - Vecteurs (pistes avec couleur et nom, refuges, zones protégées avec règles en description, zones sans réseau, tronçons exposés aux avalanches historiques, itinéraires) en GPX / KML ;
    - rasters (pentes, neige estimée) en MBTiles ou SQLiteDB lisibles en surcouche ;
    - un dossier par site, avec un mode d'emploi court (comment l'importer dans Locus et dans OsmAnd).

    Critère : import réussi dans Locus et OsmAnd sur le Pixel, captures d'écran ou constat écrit ; tailles mesurées.

# ---------- M1 Preuve Rust : algorithmes du noyau ----------
- key: C1
  title: Graphe de pistes et routage sur pistes
  milestone: M1 Preuve Rust
  labels: [algo, planifier]
  deps: [P2]
  body: |
    Graphe orienté (sens unique), coût selon pente et style, itinéraire entre deux points.
    Critère : itinéraires plausibles sur les deux sites, vérifiés dans le visualiseur.

- key: C2
  title: Rattachement aux pistes et détection d'écart
  milestone: M1 Preuve Rust
  labels: [algo, pendant]
  deps: [C1]
  body: |
    Map matching (HMM) sur le réseau ; couloir autour d'une trace prévue pour le hors piste ; seuil et délai contre les fausses alertes.
    Critère : tests sur traces synthétiques bruitées.

- key: C3
  title: Routage hors piste sur grille de coût
  milestone: M1 Preuve Rust
  labels: [algo, planifier]
  deps: [P5, P6, P9]
  body: |
    A* sur grille du relief (5 m) : évite pentes > 30°, refuse les zones interdites à la date, pondéré par la neige estimée.
    Critère : itinéraires Cervières plausibles ; aucun ne traverse une zone interdite.

- key: C4
  title: Banc d'essai du routage hors piste sur Pixel 8
  milestone: M1 Preuve Rust
  labels: [preuve, planifier]
  deps: [C3, F4]
  body: |
    Exécuter C3 en binaire Rust sur le Pixel (zone réelle Cervières, 10 × 10 km à 5 m) : temps, mémoire, énergie.
    Critère : chiffres mesurés ; alimente la décision K0.

- key: C5
  title: Modèle de temps estimé (formule)
  milestone: M1 Preuve Rust
  labels: [algo, planifier]
  deps: [C1]
  body: |
    Modèle physique : puissance, pente, friction selon la neige, facteur classique / skating (Bolger 2015). Comparaison à Munter / Tobler.
    Critère : erreur mesurée sur les traces réelles quand T1 est disponible.

- key: C6
  title: Calibration personnelle du temps estimé
  milestone: M4 v2
  labels: [algo, planifier]
  deps: [C5, T1]
  body: |
    Ajustement bayésien de quelques paramètres sur les sorties enregistrées par l'utilisateur.
    Critère : erreur réduite par rapport à C5 sur des sorties non vues.

- key: C7
  title: Heure de demi-tour avant la nuit
  milestone: M1 Preuve Rust
  labels: [algo, sécurité]
  deps: [C5]
  body: |
    Éphémérides (coucher du soleil, crépuscule) + temps restant estimé → heure limite de demi-tour.
    Critère : tests sur dates et lieux connus.

- key: C8
  title: Évaluation des zones et règles à une position et une date
  milestone: M1 Preuve Rust
  labels: [algo, sécurité]
  deps: [P9, P10]
  body: |
    Fonction : position + date → zones actives, règles applicables (bivouac, sortie d'itinéraire, feu).
    Critère : tests sur points du Risoux en février et en août.

- key: C9
  title: Modèle de prévision de batterie
  milestone: M2 Terrain hiver 2026-27
  labels: [algo, sécurité]
  deps: [T2]
  body: |
    Consommation par mode (GPS, écran, voix) et effet du froid, depuis les mesures T2.
    Critère : erreur de prévision mesurée sur une sortie non vue.

- key: C10
  title: Valider rattachement et écart sur traces réelles sous forêt
  milestone: M2 Terrain hiver 2026-27
  labels: [preuve, pendant]
  deps: [C2, T1]
  body: |
    Rejouer les traces GPX réelles : taux de bon rattachement, fausses alertes d'écart, notamment dans le Risoux.
    Critère : chiffres publiés ; seuils réglés.

# ---------- M2 Terrain hiver 2026-27 ----------
- key: T1
  title: Collecte terrain Cervières (janvier 2027)
  milestone: M2 Terrain hiver 2026-27
  labels: [terrain]
  deps: [F3]
  body: |
    Avec des apps existantes : trace GPX de chaque sortie, enregistrement des capteurs (accéléromètre, gyroscope, baromètre), étiquetage de la technique (classique, skating, SRN), notes de neige.
    Critère : protocole écrit avant le départ ; données versées dans `research/raw/terrain/`.

- key: T2
  title: Mesures de batterie par grand froid
  milestone: M2 Terrain hiver 2026-27
  labels: [terrain, sécurité]
  deps: [F3]
  body: |
    Protocole : sorties de 3 à 5 h, téléphone en poche, GPS actif ; relever niveau de batterie et température régulièrement.
    Critère : courbes de décharge par sortie.

- key: T3
  title: Collecte terrain Chapelle-des-Bois (février-mars 2027)
  milestone: M2 Terrain hiver 2026-27
  labels: [terrain]
  deps: [T1]
  body: |
    Même protocole que T1, plus le SRN sur la GTJ et le Risoux (itinéraires autorisés uniquement en période APPB).
    Critère : données versées.

- key: T4
  title: Vérifier sur le terrain la complétude d'OSM et corriger
  milestone: M2 Terrain hiver 2026-27
  labels: [terrain, carte]
  deps: [P2]
  body: |
    Secteur des Fonts (Cervières), pistes absentes à Chapelle (Chez Michel, La Morberande, Tour du village, piste éclairée). Corriger OSM.
    Critère : modifications OSM publiées avec leurs numéros de changeset.

- key: T5
  title: Observations de neige pour valider la carte d'enneigement
  milestone: M2 Terrain hiver 2026-27
  labels: [terrain, carte]
  deps: [P6]
  body: |
    Relever hauteur et qualité de neige en quelques points géolocalisés par sortie.
    Critère : observations comparées à P6.

- key: D1
  title: Jeu de données étiqueté de technique de ski
  milestone: M2 Terrain hiver 2026-27
  labels: [preuve, sport]
  deps: [T1, T3]
  body: |
    Nettoyer et découper les enregistrements capteurs en cycles étiquetés (classique, skating, sous-techniques si possible).
    Critère : jeu de données documenté.

# ---------- M3 Client v1 (Kotlin) ----------
- key: K0
  title: Décision de répartition Rust / Kotlin et intégration UniFFI
  milestone: M3 Client v1
  labels: [décision, client]
  deps: [C4]
  body: |
    Sur la base de C4 : noyau Rust via UniFFI ou client 100 % Kotlin. Si UniFFI : bibliothèque Android du noyau appelée depuis Kotlin.
    Critère : décision écrite ; appel du noyau depuis une app de test.

- key: S0
  title: Hébergement des fichiers statiques et planification du pipeline
  milestone: M3 Client v1
  labels: [serveur, infra]
  deps: [P14, P8, P19]
  body: |
    Déployé sur le cluster k3s (arm64), tout en gitops selon les règles du dépôt d'infrastructure : manifestes, Application ArgoCD et script de déploiement du dépôt d'infrastructure (build arm64 natif sur le buildkitd du cluster), DNS et règles Cloudflare dans cloudflare/. Packs servis en fichiers statiques à la manière de Worker PMTiles (pas de coût par utilisateur). Pipeline planifié en CronJobs : packs, neige du jour, BERA, état des pistes, météo.
    Critère : URLs stables des fichiers ; ArgoCD synchronisé ; coût mensuel estimé.

- key: K1
  title: Squelette de l'app Android (Compose, MapLibre, lecture de pack)
  milestone: M3 Client v1
  labels: [client, carte]
  deps: [P14]
  body: |
