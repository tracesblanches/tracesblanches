# ---------- Voix (VO) et assistance intelligente (A) ----------
- key: VO1
  title: Reprendre la pile vocale du projet speak
  milestone: M0 Fondations
  labels: [recherche, pendant]
  deps: []
  body: |
    Le projet local ../speak (NOTES.md, pixel/, app/) a déjà validé sur le Pixel 8 Pro : Pocket TTS français 6 couches (modèle d'octobre converti depuis Kyutai, WER 0) via pockettts.cpp patché, TTS entièrement sur GPU Vulkan depuis le patch ggml 0008 (validé sur le téléphone, 0 grésillement au test d'écho) : RTF 0,39, premier morceau 210 ms, sans chauffer le CPU ; 27 voix livrées (fr par défaut : estelle) ; STT Parakeet v3 int8 par sherpa-onnx ; Gemma 4 E2B par LiteRT-LM (~17 tok/s) ; Gemini Nano indisponible sur 8 Pro.
    Faire l'inventaire de ce qui se réutilise tel quel pour skimap (scripts de build Android, patchs ggml, modèles, licences des voix — `cosette` est CC-BY-NC) et de ce qui manque.
    Critère : note `docs/voix.md` listant fichiers, versions et licences repris.

- key: VO2
  title: Banque de phrases de guidage et d'alerte en français
  milestone: M1 Preuve Rust
  labels: [algo, pendant]
  deps: [F1]
  body: |
    Modèles de phrases paramétrés : direction, distances, temps restant, demi-tour, pente, zone protégée, zone sans réseau, écart d'itinéraire, rassurance, briefing du jour. Arrondis naturels (« dans deux cents mètres », « environ une heure »). Morceaux de 50 tokens au plus, coupés aux fins de phrase (mesure speak).
    Critère : générateur de texte testé, une phrase par événement du noyau.

- key: VO3
  title: Clips vocaux pré-générés dans les packs (Pocket TTS côté pipeline)
  milestone: M1 Preuve Rust
  labels: [pipeline, pendant]
  deps: [VO1, VO2]
  body: |
    Le modèle sur le téléphone coûte ~140 Mo (modèle français Q8_0 133 Mo + une seule voix extraite des 158 Mo du fichier de 27 voix). À la place : le pipeline Rust génère avec Pocket TTS (poste, GPU) les phrases fixes, les nombres, distances, durées et tous les noms de pistes, refuges et lieux d'un pack, en Ogg/Opus ; l'app assemble les clips. Silence de début coupé.
    Critère : taille des clips par pack mesurée (objectif quelques Mo) ; écoute d'annonces assemblées jugée naturelle ; repli voix Android pour tout texte non prévu.

- key: VO4
  title: Guidage parlé sur le Pixel et choix du moteur
  milestone: M1 Preuve Rust
  labels: [preuve, pendant]
  deps: [VO3, F4]
  body: |
    Rejouer un itinéraire sur le Pixel, écran éteint, en comparant : clips pré-générés (VO3), voix Android hors ligne, Pocket TTS embarqué (option à télécharger, ~140 Mo). Mesurer taille, latence, énergie, naturel.
    Énergie : mesurer la consommation par annonce et par heure de guidage (haut-parleur, écouteurs filaires, Bluetooth) et la comparer à celle du GPS sur la même heure. La voix ne doit pas peser face au GPS ; nombre d'annonces par heure réglable.
    Critère : enregistrement audio et chiffres (taille, latence, mAh par annonce et par heure) ; moteur par défaut décidé.

- key: VO5
  title: Commandes vocales hors ligne avec Parakeet v3
  milestone: M4 v2
  labels: [preuve, pendant]
  deps: [VO1]
  body: |
    Reprendre VAD Silero + Parakeet v3 int8 de speak pour « Où suis-je ? », « Temps restant ? », « Signale : trace faite ». Coût de chargement mesuré dans speak : 2,9–3,7 s pour la session ONNX ; à garder chargé ou à charger à la demande selon la batterie.
    Critère : commandes reconnues hors réseau, dehors, avec du vent.

