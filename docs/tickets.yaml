  milestone: M1 Preuve Rust
  labels: [algo, planifier]
  deps: [A3, A4, C7, P19]
  body: |
    Créneau horaire conseillé combinant météo, qualité de neige (A3), lumière, affluence (A4) et temps estimé.
    Critère : créneau produit et justifié pour chaque jour de test.

- key: A10
  title: Bilan de sortie
  milestone: M3 Client v1
  labels: [client, sport]
  deps: [K4, C5]
  body: |
    Résumé parlé et écrit : distance, temps, temps estimé contre réel, comparaison aux sorties précédentes, conditions rencontrées.
    Critère : bilan produit après une sortie réelle.

- key: A11
  title: Questions libres hors ligne — classification d'intention cadrée (LLM optionnel)
  milestone: M4 v2
  labels: [recherche]
  deps: [VO1, VO5, A1]
  body: |
    Questions libres (« Où skier demain avec du vent d'ouest ? ») répondues hors ligne à partir des données du pack. Gemini Nano est indisponible sur le 8 Pro ; speak fait tourner Gemma 4 E2B par LiteRT-LM (~17 tok/s sur CPU). Pas de LLM en v1 : toutes les réponses viennent des modèles de phrases (VO2). Si un LLM est ajouté, cadrage strict : il classe seulement la question vers une liste fermée de fonctions du noyau avec leurs paramètres ; la réponse reste produite par les modèles de phrases ; aucun chiffre, lieu ou conseil de sécurité ne sort du modèle ; question non reconnue → « je n'ai pas compris » et liste des questions possibles.
    Critère : taux de bonne classification mesuré sur un jeu de questions réelles ; décision d'ajouter ou non.

# ---------- Qualité (Q) : tests, CI, documentation de niveau public ----------
- key: Q1
  title: Jeu de données de référence versionné pour les tests sur sites réels
  milestone: M1 Preuve Rust
  labels: [infra, preuve]
  deps: [P14]
  body: |
    Aujourd'hui les tests sur données réelles sont `#[ignore]` et ne tournent jamais en CI. Extraire des deux sites un jeu réduit (quelques Mo, sources redistribuables seulement : OSM ODbL, IGN Licence Ouverte, Météo-France Etalab ; jamais les sources `personal_sources`), versionné dans `fixtures/` avec ses licences et son script de régénération en Rust (`skimap fixtures`).
    Les tests réels tournent alors en CI sans réseau. Un test qui ne trouve pas ses données échoue au lieu de passer en silence.
    Critère : `cargo test --workspace` couvre les deux sites sans réseau ni `--ignored` ; taille du jeu mesurée ; licences listées.

- key: Q2
  title: Tests de régression dorés sur les sorties du pipeline et du noyau
  milestone: M1 Preuve Rust
  labels: [infra, preuve]
  deps: [Q1]
  body: |
    Pour chaque couche et chaque site : empreinte chiffrée (km de pistes par type, surfaces par classe, histogrammes de pente et d'exposition, nombre de refuges, ETA et longueur d'itinéraires de référence, phrases générées) comparée à une référence versionnée, avec tolérances justifiées.
    Mise à jour explicite seulement (`--bless`) avec diff lisible dans la PR. Chiffres de référence reliés aux rapports de recherche.
    Critère : une modification volontaire d'un coefficient fait échouer le bon test avec un diff clair.

- key: Q3
  title: Tests de propriétés et fuzzing des lecteurs de fichiers
  milestone: M1 Preuve Rust
  labels: [infra, preuve]
  deps: [F1]
  body: |
    Propriétés (proptest) : géométrie (orientation, aires, découpes), routage (optimalité A* contre Dijkstra, ETA monotone avec la distance et le dénivelé), rattachement (trace sur piste rattachée à 100 %), projection de neige, phrases (arrondis).
    Fuzzing (cargo-fuzz) de tout ce que le téléphone lit d'un fichier téléchargé : pack, manifeste, SKR1, PMTiles, GeoTIFF, BERA XML. Aucun panic accepté.
    Critère : campagnes de fuzzing d'au moins 10 min par cible sans plantage ; corpus versionné ; propriétés en CI.

- key: Q4
  title: Couverture et tests de mutation mesurés
  milestone: M1 Preuve Rust
  labels: [infra, preuve]
  deps: [Q1]
  body: |
    cargo-llvm-cov en CI avec seuil par crate (noyau et lecteur de pack les plus hauts) ; cargo-mutants sur le noyau, l'assistance et la voix, en tâche planifiée. Les mutants survivants deviennent des tests ou sont justifiés.
    Critère : chiffres de couverture et score de mutation par crate publiés dans le README.

- key: Q5
  title: Bancs de performance de non-régression sur les cas dominants
  milestone: M1 Preuve Rust
  labels: [infra, preuve]
  deps: [Q1]
  body: |
    Mesurer ce qui domine : routage hors piste sur la plus grande grille, rattachement d'une sortie entière, routage sur le graphe complet, exposition aux avalanches de Cervières, build-all complet. Comptage d'instructions (stable sur les runners GitHub) en CI, temps réel sur le poste.
    Critère : un ralentissement volontaire de 10 % sur un cas dominant fait échouer la CI.

- key: Q6
  title: CI complète, chaîne d'approvisionnement et documentation générée
  milestone: M1 Preuve Rust
  labels: [infra]
  deps: [F1]
  body: |
    cargo-deny (licences compatibles, avis de sécurité, sources), `cargo doc` sans avertissement et doctests, tests sans la fonction `pipeline` pour le téléphone, compilation Android, actions épinglées par hash, durée totale mesurée et cache.
    Tâche planifiée hebdomadaire : build-all réel des deux sites avec téléchargements, comparé aux références de Q2.
    Critère : CI verte sur la première poussée ; tâche planifiée réussie une fois.

- key: Q7
  title: README et documentation de niveau public
  milestone: M1 Preuve Rust
  labels: [infra]
  deps: [Q2, Q4]
  body: |
    README racine : ce que fait skimap, captures du visualiseur, démarrage en 5 minutes, schéma d'architecture, sources et licences des données, statut et chiffres de preuve. README de chaque crate au même plan (rôle, API, entrées, sorties, preuve chiffrée, limites). CONTRIBUTING (règles, tests, références dorées), guide des données.
    Critère : un développeur Rust qui ne connaît pas le projet reconstruit un pack en suivant le README seul (essai fait par un agent neuf).

- key: Q8
  title: Qualité du client Kotlin (tests unitaires, interface, captures, CI)
  milestone: M3 Client v1
  labels: [infra, client]
  deps: [K1]
  body: |
    Tests JVM, tests Compose, tests de captures d'écran (thème clair, sombre, grande police), tests instrumentés sur émulateur en CI, detekt et ktlint, lint Android sans avertissement, contrôles d'accessibilité, profil de démarrage.
    Critère : CI Android verte ; une régression visuelle volontaire est détectée.

- key: Q9
  title: Banc de scénarios de sortie rejoués de bout en bout
  milestone: M1 Preuve Rust
  labels: [infra, preuve]
  deps: [Q1, J1]
  body: |
    Traces synthétiques et réelles rejouées dans le noyau avec une horloge simulée : sortie normale, écart, piste fermée, retard, brouillard, pause au refuge, abandon. Pour chaque scénario : annonces, alertes et bascules attendues, dans l'ordre et à la seconde près.
    Les mêmes scénarios servent aux tests instrumentés du client.
    Critère : au moins 15 scénarios sur les deux sites en CI.

# ---------- Journée planifiée et automatismes (J) ----------
- key: J1
  title: Plan de journée dans le noyau
  milestone: M3 Client v1
  labels: [algo, planifier]
  deps: [A1, A5, A6, A9, C1, C7, VO2]
  body: |
    Le matin, sans gants : briefing, créneau, fartage, boucles proposées, équipement ; on valide une boucle. Le plan contient l'itinéraire, les heures de passage, l'heure de demi-tour, les annonces prévues et les clips nécessaires. Sérialisé, lisible par le téléphone sans réseau.
    Critère : plan produit pour les deux sites sur des journées passées ; relu.

- key: J2
  title: Plans B pré-calculés et bascule automatique
  milestone: M3 Client v1
  labels: [algo, sécurité]
  deps: [J1, C2, A8]
  body: |
    À chaque intersection utile : raccourci vers l'arrivée, contournement d'une piste fermée, version écourtée si retard. Pendant la sortie, la bascule est choisie et annoncée sans manipulation ; on peut la refuser d'un geste.
    Critère : bascules correctes sur les scénarios de Q9.

- key: J3
  title: Démarrage, pause et arrêt automatiques de la sortie
  milestone: M3 Client v1
  labels: [algo, pendant]
  deps: [J1, C2]
  body: |
    Départ détecté au premier mouvement près du départ du plan, pause à l'arrêt, refuge reconnu, fin à l'arrivée avec bilan. Côté noyau la décision ; côté client la reconnaissance d'activité Android.
    Critère : aucune manipulation nécessaire sur les scénarios normaux de Q9.

- key: J4
  title: Politique de parole « silence si tout va bien »
  milestone: M3 Client v1
  labels: [algo, pendant]
  deps: [J1, VO2]
  body: |
    Hiérarchie des événements (sécurité, direction, horaire, confort), débit maximal d'annonces par heure, regroupement, rien à dire sur une piste évidente. Réglable.
    Critère : nombre d'annonces par heure mesuré sur les scénarios ; aucune alerte de sécurité perdue.

- key: J5
  title: Écran « journée » et validation en un geste
  milestone: M3 Client v1
  labels: [client, planifier]
  deps: [J1, K1]
  body: |
    Un écran unique le matin, raisons de chaque choix lisibles, un bouton « Valider la journée ». Le plan est envoyé au proche choisi (K10).
    Critère : journée validée en moins de 30 s sur le Pixel.

- key: K12
  title: Interface utilisable avec des gants et en plein soleil
  milestone: M3 Client v1
  labels: [client, pendant]
  deps: [K1]
  body: |
    Material 3 et règles Android suivies, mais cibles de 72 dp au moins, pas de boutons de zoom : pincement à mains nues, zoom à un doigt, zoom automatique selon le contexte et un seul grand bouton « recentrer » qui n'apparaît qu'après un déplacement de la carte ; aucun geste fin indispensable, contraste élevé sur fond de neige, info jamais portée par la couleur seule, grande police.
    Critère : toutes les actions de sortie faites avec des gants de ski sur le Pixel.

- key: K13
  title: Commandes physiques, écran verrouillé et montre
  milestone: M3 Client v1
  labels: [client, pendant]
  deps: [K4, K5]
  body: |
    Bouton du casque et boutons de volume (temps restant, prochaine direction ; appui long « ramène-moi »), notification en direct sur l'écran verrouillé, tuile Wear OS optionnelle.
    Critère : sortie guidée sans déverrouiller le téléphone.

# ---------- Toutes les stations (G) ----------
- key: G1
  title: Pistes manquantes dans OSM ajoutées au pack
  milestone: M4 v2
  labels: [pipeline, carte]
  deps: [P2, P13]
  body: |
    Détecter les pistes annoncées par l'exploitant et absentes d'OSM (4 à Cervières aujourd'hui). Tracé pris chez l'exploitant (Geotrek) s'il est publié, sinon reconstruit depuis nos traces ou les chemins IGN. Couche séparée « tracé estimé » avec sa source ; correction OSM préparée pour validation humaine, jamais envoyée automatiquement (règles d'import OSM).
    Critère : les 4 pistes de Cervières présentes et marquées estimées.

- key: G2
  title: Pipeline pour les 219 domaines recensés
  milestone: M4 v2
  labels: [pipeline, infra]
  deps: [P3, S0, Q2]
  body: |
    build-all générique sur tous les domaines, parallélisé, exposition aux avalanches seulement là où il y a du relief. Temps et taille totaux mesurés.
    Critère : packs produits pour les 219 domaines ; échantillon de 10 vérifié.

- key: G3
  title: Sources d'état des pistes pour tous les domaines
  milestone: M4 v2
  labels: [recherche, juridique]
  deps: [P3, L4]
  body: |
    Inventaire par domaine des sources d'ouverture (instances Geotrek, Nordic France, sites des stations) et de leurs conditions ; partenariat Nordic France.
    Critère : part des 219 domaines couverte par une source autorisée.

- key: G4
  title: Règles de zones et de bivouac généralisées
  milestone: M4 v2
  labels: [pipeline, sécurité]
  deps: [P9, G2]
  body: |
    Règles nationales (APPB, réserves, coeurs de parc, codes) appliquées automatiquement partout ; arrêtés locaux non recensés signalés « règles locales non vérifiées ».
    Critère : chaque domaine a ses règles nationales et un statut clair pour les locales.

# ---------- Ajouts du 15/11/2026 ----------
- key: P22
  title: Plan des pistes officiel transcrit sur nos cartes
  milestone: M1 Preuve Rust
  labels: [algo, carte]
  deps: [P2, C1]
  body: |
    Les stations publient un plan des pistes dessiné (PDF ou image, souvent en perspective, pas à l'échelle). Le pipeline le lit en local, extrait tracés colorés et étiquettes, apparie sa topologie au graphe OSM et aux repères (refuges, villages, sommets), puis transcrit ses informations sur nos propres géométries : nom, numéro, couleur, sens, type de piste, boucles, liaisons, départs et parkings. Les pistes absentes d'OSM sont tracées sur le terrain réel et marquées « tracé estimé » (alimente G1).
    Appariement soit exact (topologie et étiquettes certaines), soit par un modèle appris ; jamais d'approximation silencieuse. Jeu d'entraînement : les domaines où OSM a déjà les pistes, noms, couleurs et sens donnent des paires (plan, OSM) étiquetées automatiquement ; évaluation séparée par domaine, Cervières et Chapelle-des-Bois en test seulement.
    Rendu natif uniquement : la carte dessine ces pistes dans notre style, comme les autres. Aucune image du plan, ni couche raster, ni plan déformé dans un pack ou dans le dépôt ; l'image de la station n'est jamais redistribuée.
    Critère : part des pistes du plan transcrites et appariées, attributs vérifiés à la main sur Cervières et Chapelle-des-Bois, écarts avec OSM (ajouts, corrections, conflits) listés.

- key: K14
  title: Publication sur le Play Store (test interne)
  milestone: M3 Client v1
  labels: [client, infra]
  deps: [K1, Q8, O1]
  body: |
    Reprendre l'outillage de ../tablonaute (compte développeur Android existant, fastlane, signature d'envoi, store_assets, page de confidentialité, liste de contrôle de publication) ; ne pas reprendre son interface. Fiche, captures, politique de confidentialité publiée sur le site statique du projet (O1). Piste de test interne d'abord.
    Critère : build signé envoyé sur la piste de test interne et installé sur le Pixel depuis le Play Store.

- key: K15
  title: Fonds de carte par pratique (fond, SRN, guidage)
  milestone: M3 Client v1
  labels: [client, carte]
  deps: [K1, K3]
  body: |
    Un même jeu de tuiles vectorielles (Plan IGN, OSM) et nos couches, plusieurs styles natifs MapLibre qui n'affichent pas la même chose. Plan IGN v2 est trop dense pour un coup d'œil.
    - Fond : pistes par couleur et technique, état et damage, sens, départs, parkings, foyers ; relief discret ; peu de toponymes.
    - SRN : courbes de niveau marquées, pentes, exposition aux avalanches, forêt, zones protégées et bivouac, refuges, zones sans réseau ; pistes en second plan.
    - Guidage : minimal, pour un coup d'œil avec des gants en plein soleil : itinéraire du jour, prochaine décision, position.
    Le style suit le mode (journée planifiée, pratique choisie) sans manipulation ; même jeu de styles dans le visualiseur du poste.
    Critère : chaque style jugé lisible sur le Pixel au soleil ; captures comparées ; aucune tuile supplémentaire dans le pack.

- key: O1
  title: Organisation GitHub, site statique et ouverture aux contributions
  milestone: M3 Client v1
  labels: [infra]
  deps: [F2]
  body: |
    Comme les autres projets de l'utilisateur (un autre projet : org GitHub, dépôt `.github` avec profil et bannière, site `<org>.github.io` statique avec accueil, démarrage, FAQ, confidentialité) : organisation dédiée, transfert du dépôt au moment de le rendre public, site statique soigné.
    Contributions bienvenues, contributions assistées par IA bienvenues : CONTRIBUTING (tests et références dorées obligatoires, exception boutiques acceptée par chaque contributeur, IA autorisée avec relecture humaine et preuves), modèles d'issues et de PR, code de conduite.
    Textes publics : règles d'écriture de l'utilisateur (voix active, faits vérifiés, pas d'autopromotion).
    Critère : org créée par l'utilisateur, site en ligne, dépôt transféré et public.

- key: E1
  title: "Budget d'énergie du code : précalculs serveur, noyau et Kotlin sobres"
  milestone: M3 Client v1
  labels: [infra, pendant]
  deps: [J1, K1]
  body: |
    Le téléphone ne calcule que ce qui dépend de la position et de l'heure ; tout le reste est précalculé côté serveur et livré dans le pack ou le plan : graphe simplifié, index spatial de rattachement, temps de parcours par arête et par pratique, points de décision, plans B, séquences de clips, géométries par zoom.
    Noyau Rust : suivi par fix sans allocation, coût mesuré en instructions par fix et en CI (Q5). Données lues sans copie (mmap, formats à plat).
    Kotlin : rien ne tourne écran éteint hors du service de localisation et de l'audio ; aucune scrutation ni minuterie de fond ; coroutines sur le bon dispatcher ; Compose stable (recompositions comptées), R8, profils de référence, aucune allocation dans le chemin d'un fix ; appel du noyau par lots plutôt que par fix si les fixes arrivent par lots.
    Mesure : Macrobenchmark et Microbenchmark Jetpack, Perfetto avec les rails d'énergie (ODPM) du Pixel 8, budget par heure de sortie écran éteint, régression bloquante en CI quand elle est mesurable.
    Critère : budget d'énergie par mode (poche, approche, interaction, pause) mesuré sur le Pixel, comparé au coût du GPS seul.

- key: E2
  title: Mode préparation sur le téléphone et mode ski de plusieurs jours
  milestone: M3 Client v1
  labels: [client, planifier]
  deps: [J1, E1, K2]
  body: |
    Règle de répartition : chaque calcul tourne là où ses entrées sont les plus petites. Serveur : ce qui part de grosses données brutes ou sert tout le monde (LiDAR, OSM, avalanches, interrogation des sources). Téléphone : ce qui est personnel, ou dérivé à bas coût de petites entrées quotidiennes.
    Mode préparation (en charge, Wi-Fi, WorkManager avec contraintes) : plans de journée pour les jours du séjour avec les prévisions J+1 à J+3, boucles et plans B selon tes préférences, temps estimés recalibrés sur tes sorties, routage hors piste, éventuellement neige du jour projetée sur place à partir des données par massif (quelques Ko au lieu d'un raster), synthèse des noms non prévus.
    Mode ski (plusieurs jours, sans réseau possible) : aucun calcul lourd, plans déjà prêts, âge de chaque info affiché, prévisions périmées signalées.
    Pas de calcul réparti entre téléphones d'utilisateurs : le calcul serveur total reste petit et vérifier des résultats venus de tiers coûterait plus cher.
    Critère : séjour de 3 jours simulé en mode avion après une préparation ; temps et énergie de la préparation mesurés sur le Pixel en charge ; température du téléphone suivie.

- key: N1
  title: Alerte et relais entre utilisateurs par proximité, sans réseau
  milestone: M4 v2
  labels: [recherche, sécurité]
  deps: [K4, K10]
  body: |
    Les téléphones qui ont l'app se parlent directement (Bluetooth basse consommation, éventuellement Wi-Fi Aware ou Nearby Connections), sans réseau.
    Usages à évaluer : skieur blessé hors réseau dont l'appel est relayé par un autre utilisateur qui passe, puis transmis dès que l'un d'eux retrouve du réseau (stockage et retransmission) ; mode groupe (où sont mes amis, alerte de séparation) ; signalements partagés au refuge (trace faite, piste damée).
    À mesurer et vérifier : portée réelle sur neige et en forêt entre un Pixel 8 et un Pixel 8 Pro, coût batterie de l'émission et de l'écoute en veille, limites Android en arrière-plan, probabilité de croiser un autre utilisateur selon la fréquentation, vie privée (identifiants tournants, chiffrement), abus et fausses alertes, règles d'appel du 112 par un tiers.
    Jamais présenté comme un DVA. Interférence d'un téléphone avec un DVA à vérifier (recommandations ICAR).
    Critère : rapport chiffré et décision ; si favorable, prototype de relais entre deux téléphones mesuré dehors.

- key: N2
  title: Mode groupe, positions des membres et alerte de séparation
  milestone: M3 Client v1
  labels: [client, sécurité]
  deps: [K4, J1]
  body: |
    Priorité de l'utilisateur. Un groupe créé avant la sortie (code ou QR échangé au chalet, sans compte) partage les positions de ses membres.
    Sans réseau : Bluetooth basse consommation entre téléphones à portée, retransmission de proche en proche dans le groupe (la dernière position connue de chacun circule). Avec réseau : courts messages chiffrés de bout en bout par le serveur ou par SMS, dernier recours.
    Sur la carte : chaque membre, l'âge de sa dernière position et sa source. Alertes : membre qui décroche (distance et durée réglables), membre arrêté longtemps hors d'un refuge, membre sorti de l'itinéraire du plan commun, regroupement aux intersections du plan. Tout fonctionne sur le téléphone ; le serveur ne fait que relayer des messages qu'il ne peut pas lire.
    Batterie : écoute et émission à faible cycle, réglées par les modes de E1.
    Critère : sortie à deux (Pixel 8 et Pixel 8 Pro) avec séparation simulée, alerte reçue ; portée et coût batterie mesurés.

- key: VO6
  title: App bilingue français et anglais, voix par langue en paquet séparé
  milestone: M3 Client v1
  labels: [client, pendant]
  deps: [VO3, K2]
  body: |
    Interface en anglais et en français, langue du téléphone détectée, anglais par défaut. Textes d'interface dans les ressources Android (quelques Ko).
    Les clips vocaux pré-générés pèsent quelques Mo par site et par langue : ils sortent du pack de base et deviennent un paquet de langue séparé par site, téléchargé seulement pour la langue choisie (et remplacé si l'on change de langue). Banque de phrases anglaise (VO2) et clips anglais générés par Pocket TTS côté pipeline ; noms propres français lus correctement par la voix anglaise vérifiés par transcription.
    Le catalogue du serveur (S0) liste les paquets de langue ; une mise à jour ne télécharge que la langue installée.
    Critère : pack de base sans voix ; paquet FR et paquet EN par site mesurés ; changement de langue hors ligne refusé proprement, en ligne fait en un téléchargement.

- key: C11
  title: Temps estimé appris par groupe et ajusté pendant la sortie
  milestone: M3 Client v1
  labels: [algo, planifier]
  deps: [C5, J1, J2]
  body: |
    Le temps estimé apprend de vos sorties et s'adapte au groupe du jour. Exemple de l'utilisateur : avec les enfants on va beaucoup plus lentement, on explore à côté, on s'arrête, on joue.
    - Profils de groupe enregistrés sur le téléphone (« seul », « en famille », « avec X ») : composition (adultes, enfants et âges), technique, niveau. Le profil du jour se choisit le matin en un geste ; le mode groupe (N2) peut le proposer.
    - Le modèle sépare vitesse en mouvement (par pente et technique) et temps d'arrêt (fréquence et durée des pauses, jeux, détours). Chaque profil a ses paramètres, appris par ajustement bayésien sur ses sorties passées (prolonge C6) ; un profil neuf part d'a priori raisonnables (enfants selon l'âge) avec une incertitude large, affichée.
    - Pendant la sortie, les paramètres se mettent à jour avec la progression réelle ; l'heure d'arrivée et le demi-tour se recalculent.
    - L'app propose, elle n'impose pas : « Vous allez 40 % moins vite que prévu, avec plus de pauses. Je propose la boucle courte, retour 15 h 20. » Accepter ou refuser d'un geste. Seul le demi-tour avant la nuit reste une alerte de sécurité (J2).
    - Le plan du matin affiche une fourchette (ex. 2 h 30 à 3 h 15) plutôt qu'un chiffre unique tant que le profil a peu d'historique.
    Critère : erreur de l'heure d'arrivée réduite sur des sorties réelles par profil (adulte seul, famille), par rapport au modèle C5 seul ; propositions jugées pertinentes sur des rejeux de traces lentes avec pauses (Q9).

- key: G5
  title: Domaines de jeu SRN hors stations (GTJ, GTV, Vercors, etc.)
  milestone: M4 v2
  labels: [pipeline, carte]
  deps: [P3, G2]
  body: |
    Le ski de randonnée nordique se pratique surtout hors des domaines damés : grandes traversées (Grande Traversée du Jura, Grande Traversée du Vercors), hauts plateaux du Vercors, Chartreuse, crêtes des Vosges, Aubrac, plateaux du Queyras, etc.
    Recenser ces domaines de jeu pour toute la France : itinéraires balisés et traversées (OSM route=ski et piste:type nordic ou skitour hors domaines damés, Geotrek des parcs et des massifs, Camptocamp), topos publiés, et zones propices calculées (pente faible, neige fiable, forêt praticable, accès) ; chaque domaine avec son emprise, ses itinéraires, ses sources et licences.
    Ils deviennent des sites comme les stations (G2) : même pack, même plan de journée, sans état de damage, avec les règles des zones protégées (parcs, réserves comme les Hauts-Plateaux du Vercors) mises en avant.
    Critère : liste chiffrée des domaines SRN trouvés, vérifiée à la main pour la GTJ, la GTV et les Hauts-Plateaux du Vercors ; packs construits pour ces trois.

- key: H1
  title: Fiches pratiques des refuges et des stations (contacts, secours, redevance)
  milestone: M3 Client v1
  labels: [pipeline, carte]
  deps: [P11, G2]
  body: |
    Refuges cliquables : fiche avec nom, type (gardé, non gardé, abri), période de gardiennage, places, équipements (poêle, bois, eau), accès hivernal, téléphone, site web, liens vers la source (refuges.info, Camptocamp, OSM), date de la dernière information. Le téléphone s'appelle d'un geste.
    Pour chaque station (toute la France, G2) : postes de secours et numéro des pisteurs-secouristes, points de vente de la redevance (foyers, caisses, offices de tourisme), prix indicatifs (journée, semaine, saison, enfants, Nordic Pass national et régional) avec leur date et leur source, téléphones et sites (station, office de tourisme, école de ski), parkings. Information seulement : pas d'achat dans l'app.
    Sources : OSM (phone, contact:*, website, emergency, amenity, shop=ticket), Nordic France et sites des stations, refuges.info et Camptocamp ; licences et droit des bases de données vérifiés avant toute publication (sinon usage personnel). Chaque champ porte sa source et sa date ; un prix sans date n'est pas affiché.
    Le 112 reste affiché en premier dans toute fiche de secours.
    Critère : fiches complètes vérifiées à la main pour 10 stations et 20 refuges ; part des 219 domaines avec secours, point de vente et prix datés.

- key: H2
  title: Mode libre et zones de validité des redevances
  milestone: M3 Client v1
  labels: [client, carte]
  deps: [G2, H1]
  body: |
    Mode par défaut : la carte montre tout ce qui existe dans le cadre affiché, toutes stations et domaines SRN confondus, sans choisir une station. Le mode station reste disponible pour se concentrer sur un domaine.
    Zones de validité des redevances (« zones forfait ») : pour chaque titre (redevance d'un site, d'un regroupement comme l'Espace nordique jurassien, Nordic Pass départemental, régional ou national), l'emprise et les pistes couvertes, avec prix indicatifs datés (H1). La carte montre où ton titre est valable, et signale une piste d'un autre domaine ou hors de ta redevance avant que tu ne t'y engages ; à l'inverse, elle montre les pistes accessibles avec ton titre que tu aurais pu manquer.
    Packs : téléchargement par zone (cadre ou massif) couvrant plusieurs domaines d'un coup, sans doublon de données communes.
    Critère : Jura (redevance ENJ et Nordic Pass) et Haut-Doubs vérifiés à la main ; une sortie qui franchit deux domaines affichée et annoncée correctement.

- key: SR1
  title: Difficulté d'un tracé SRN et conseils
  milestone: M3 Client v1
  labels: [algo, planifier]
  deps: [C3, P5, G5]
  body: |
    Pour tout tracé SRN (itinéraire publié, tracé dessiné ou calculé hors piste) : une difficulté claire (facile, moyen, difficile, très difficile) avec ses raisons, et des conseils.
    Facteurs : pentes en montée et en descente le long du tracé (répartition, passages les plus raides, longueur des passages), descente en forêt dense ou étroite (hauteur de canopée LiDAR), dénivelé et longueur, part de plat, éloignement d'une sortie ou d'une route, zones sans réseau, exposition aux avalanches et zones protégées, orientation et altitude (neige, vent), et conditions du jour quand elles sont connues (neige fraîche à tracer, croûte, regel).
    Conseils : peaux courtes ou écailles selon les montées, technique de descente (chasse-neige, conversion) selon les pentes, glisse si long plat, passages à éviter, demi-tour conseillé, équipement.
    Calibrage sur des tracés cotés par des sources publiées (Camptocamp, topos SRN, parcs) avec évaluation séparée par itinéraire ; règles lisibles avant tout modèle opaque ; jamais « facile » pour un tracé qui traverse une zone exposée aux avalanches.
    Critère : cotation et conseils relus à la main sur 20 tracés variés (GTJ, Vercors, Queyras, Vosges, Jura), accord mesuré avec les cotations publiées.

# ---------- Réserves à corriger (X) ----------
- key: X1
  title: "Plans de pistes en perspective et pages multiples"
  milestone: M3 Client v1
  labels: [algo, carte]
  deps: [P22]
  body: |
    112 plans sur 158 ne se calent pas : panoramas en perspective (64, aucun accord étiquettes/repères) et pages à plusieurs cartes ou trop peu de paires (48). Les 22 plans en JPEG/PNG ne sont pas lus.
    Piste de correction : découper les pages en cartes ; pour les panoramas, estimer le point de vue en rendant une vue 3D du relief LiDAR (position, cap, focale) et apparier le dessin à ce rendu plutôt qu'à une carte à plat ; lire les images comme les PDF-image.
    Critère : part des plans calés mesurée avant/après, par type de plan.

- key: X2
  title: "Plan de Cervières illisible (image floue)"
  milestone: M3 Client v1
  labels: [algo, carte]
  deps: [P22]
  body: |
    Le plan de Cervières est une image de 1 280 px : bleu proche du fond turquoise, OCR qui ne lit ni Savare ni Izoard, longueurs fausses (« 75km » pour 7,5) ; 3 pistes sur 8 transcrites, 6 points d'appui seulement.
    Pistes de correction : demander à la station le plan source (vectoriel) ; segmentation des couleurs dans un espace perceptuel avec masque du fond ; OCR avec lexique des noms OSM et IGN du domaine ; contrôle des longueurs lues contre les longueurs OSM.
    Critère : au moins 6 pistes sur 8 transcrites, erreur médiane des points d'appui mesurée sur plus de 15 points.

- key: X3
  title: "Modèle d'appariement entraîné presque seulement sur le Jura"
  milestone: M3 Client v1
  labels: [algo, carte]
  deps: [P22, X1]
  body: |
    3 groupes de domaines, presque tous jurassiens, 75 paires positives : la tenue sur les plans alpins, pyrénéens, vosgiens et du Massif central n'est pas mesurée ; la précision ne vaut que pour les pistes que l'appariement exact sait déjà trancher.
    Pistes de correction : élargir l'étiquetage grâce à X1 ; évaluation par massif ; jeu de vérification relu à la main hors Jura ; étiquettes indépendantes du nom pour mesurer le cas sans nom.
    Critère : précision et rappel par massif, au moins 4 massifs.

- key: X4
  title: "Appariement exact fragile"
  milestone: M3 Client v1
  labels: [algo, carte]
  deps: [P22]
  body: |
    À Chapelle-des-Bois, de petits écarts de fiche de lecture font varier le résultat de 25 à 32 pistes ; le Chemin du Sioux de Cervières est refusé à 48 % pour un seuil de 50 %.
    Pistes de correction : test de couverture tolérant au décalage local (après calage non rigide) ; seuil justifié par une courbe précision/rappel ; stabilité mesurée par perturbation de la fiche.
    Critère : résultat stable (± 1 piste) sous perturbations réalistes de la fiche.

- key: X5
  title: "Ne plus dépendre d'Overpass"
  milestone: M3 Client v1
  labels: [pipeline, carte]
  deps: [P2]
  body: |
    Overpass refuse les connexions depuis le 15/11/2026 et son miroir répond 504 ; les repères des plans passent en secours par la toponymie IGN.
    Piste de correction : lire tous les objets OSM nécessaires depuis un extrait local (Geofabrik France, mis à jour par le pipeline) plutôt que par une API distante ; Overpass jamais indispensable.
    Critère : build-all et P22 complets sans aucune requête Overpass.

- key: X6
  title: "Style SRN trop chargé près des pentes raides"
  milestone: M3 Client v1
  labels: [client, carte]
  deps: [K15]
  body: |
    Exposition aux avalanches (rose), pentes (rouge, jaune) et couloirs connus se superposent près des pentes raides de Cervières.
    Pistes de correction : n'afficher l'exposition qu'en vue large et les pentes de près, ou un choix exclusif pentes/exposition ; hachures pour l'une des deux ; tester avec l'utilisateur sur le Pixel au soleil.
    Critère : vue raide jugée lisible par l'utilisateur.

- key: X7
  title: "Neige estimée encore en raster et état inconnu dessiné comme ouvert"
  milestone: M3 Client v1
  labels: [client, carte]
  deps: [K15, P6]
  body: |
    La neige reste un raster de 25 m masqué par défaut ; une piste sans état connu est dessinée comme ouverte.
    Pistes de correction : classes de neige en polygones vectoriels comme les pentes ; état inconnu avec un rendu propre (trait neutre, mention « état inconnu » dans la fiche).
    Critère : neige native en clair et en sombre ; aucune piste à l'état inconnu présentée comme ouverte.

- key: X8
  title: "Exposition aux avalanches sans la CLPA dans les packs publics"
  milestone: M3 Client v1
  labels: [algo, sécurité]
  deps: [P18, L6]
  body: |
    Sans la CLPA (non publiable tant que la DDT 05 n'a pas répondu), 1,68 % de la surface des avalanches connues de Cervières est affiché « peu exposé » dans le pack public.
    Pistes de correction : recalibrer le modèle (frottement de forêt, alpha, #31) pour couvrir ces emprises sans la CLPA ; obtenir l'accord de la DDT 05 (courrier prêt) ; en attendant, mention claire dans la fiche que le modèle seul ignore les avalanches historiques.
    Critère : part des emprises CLPA classées « peu exposé » par le modèle seul réduite et mesurée.

- key: X9
  title: "Départs de pistes absents des données"
  milestone: M3 Client v1
  labels: [pipeline, carte]
  deps: [P2, H1]
  body: |
    Il n'existe pas de couche « départs » : parkings et accueils OSM en tiennent lieu.
    Pistes de correction : départs déduits (extrémités du graphe proches d'un parking ou d'un accueil), départs lus sur les plans (P22), départs des sources des stations (H1).
    Critère : départs vérifiés à la main sur 10 domaines.

- key: X10
  title: "Fausses pauses dans les montées lentes"
  milestone: M3 Client v1
  labels: [algo, pendant]
  deps: [J3]
  body: |
    Une fausse pause en 3 h à Cervières avec un GPS à σ 10 m, deux avec un GPS dégradé, sept en montée à 0,3–0,5 m/s ; un aller-retour d'enfant de moins de 40 m compte comme un arrêt.
    Pistes de correction : détection d'arrêt par capteurs de mouvement (accéléromètre, pas) en plus du GPS ; seuils dépendant de la pente ; tests sur traces réelles (T1).
    Critère : zéro fausse pause sur les scénarios de montée lente et sur des traces réelles.

- key: X11
  title: "Itinéraires recalculés sans annonces de sécurité"
  milestone: M3 Client v1
  labels: [algo, sécurité]
  deps: [J2, C8]
  body: |
    Un itinéraire calculé pendant la sortie n'annonce ni les zones sans réseau ni les couloirs d'avalanche ni les zones protégées.
    Piste de correction : le recalcul produit les mêmes annonces que le plan du matin (fonction commune), testé par scénario Q9.
    Critère : un scénario Q9 de recalcul qui traverse une zone sans réseau et un couloir, annonces vérifiées.

- key: X12
  title: "Fermetures ENJ seulement sur voies OSM"
  milestone: M3 Client v1
  labels: [algo, pendant]
  deps: [J2, P13]
  body: |
    Les fermetures sont exprimées en voies OSM ; les itinéraires ENJ donnés en géométrie ne sont rattachés qu'à 80 % des points à moins de 20 m.
    Piste de correction : appariement des géométries ENJ au graphe par HMM (comme le rattachement C2), contrôle des 20 % restants.
    Critère : taux de rattachement des itinéraires ENJ ≥ 98 %, écarts relus.

- key: X13
  title: "Table de suivi du plan trop lourde"
  milestone: M3 Client v1
  labels: [algo, pendant]
  deps: [J1, E1]
  body: |
    La table à plat répète la géométrie commune de chaque plan B : 560 Ko pour un plan de 3 h à Chapelle.
    Piste de correction : géométrie partagée et plans B en références sur elle.
    Critère : taille divisée et coût par fix inchangé (mesure).

- key: X14
  title: "Temps estimé de l'adulte au rythme du modèle"
  milestone: M3 Client v1
  labels: [algo, planifier]
  deps: [C11]
  body: |
    Pour un adulte au rythme du modèle, l'apprentissage n'apporte rien le matin et sa fourchette est trop étroite (40 à 75 % de couverture au lieu de 80 %) ; sans profil choisi, la première proposition faite à une famille sous-estime son retour (+23 min).
    Pistes de correction : variance du rythme apprise par profil et calibrée (couverture mesurée) ; proposer le choix du profil au départ quand le rythme observé ne colle pas au profil adulte.
    Critère : couverture de la fourchette à 80 % ± 5 sur les jeux de validation ; erreur de la première proposition famille réduite.

- key: X15
  title: "Assistant faiblement testé"
  milestone: M3 Client v1
  labels: [infra, planifier]
  deps: [Q4]
  body: |
    Score de mutation de l'assistant à 49,8 % : le code qui dépend de la météo n'est jamais exercé sans Open-Meteo.
    Piste de correction : jeux de météo synthétiques versionnés couvrant froid, vent, brouillard, neige fraîche, redoux ; tests du briefing, du fartage, de la qualité de neige et des alertes sur ces jeux.
    Critère : score de mutation de l'assistant ≥ 75 %.

- key: X16
  title: "Boucles proposées trop souvent en aller-retour"
  milestone: M3 Client v1
  labels: [algo, planifier]
  deps: [A5]
  body: |
    La boucle proposée à Cervières est à 49 % en aller-retour.
    Piste de correction : pénaliser la réutilisation des tronçons dans le classement, chercher de vraies boucles (cycles) avant les allers-retours, et le dire quand un aller-retour est la seule option.
    Critère : part d'aller-retour mesurée sur les boucles proposées des deux sites, avant/après.

- key: X17
  title: "Packs publics sans état des pistes ni météo ni assistant"
  milestone: M3 Client v1
  labels: [décision, planifier]
  deps: [S0, L4, G3]
  body: |
    Le serveur public n'utilise pas les sources d'usage personnel : ses packs perdent l'état des pistes, la météo heure par heure et le briefing, le fartage, la qualité de neige et les suggestions.
    Pistes de correction : canal privé réservé à l'utilisateur derrière Cloudflare Access ; sources publiables de remplacement (Météo-France AROME en Licence Ouverte pour la météo ; accords Nordic France et ENJ pour l'état) ; l'assistant tourne sur le téléphone avec la météo publiable.
    Critère : décision écrite ; pack public avec météo publiable et assistant actif.

- key: X18
  title: "Limites du serveur avant de nombreux utilisateurs"
  milestone: M3 Client v1
  labels: [serveur, planifier]
  deps: [S0, S2]
  body: |
    R2 à activer au-delà de quelques milliers d'utilisateurs (moyen de paiement, conditions du CDN gratuit pour les gros fichiers) ; règle Cloudflare à ajouter pour couper le contrôle de navigateur sur l'API ; alerte facultative par Gmail limitée à 400 envois par 24 h.
    Pistes de correction : bascule R2 préparée et testée ; règle Cloudflare en gitops ; canal d'alerte de secours documenté.
    Critère : test de charge simulé et coût mesuré à 10 000 utilisateurs.

- key: X19
  title: "Trous de couverture des tests"
  milestone: M3 Client v1
  labels: [infra]
  deps: [Q1, Q6]
  body: |
    La couverture ARCEP n'est pas recalculée en CI (pas de GeoPackage réduit) ; les licences INPN et geo.api.gouv.fr restent « non vérifié » dans les fixtures ; fuzz/Cargo.lock est un fichier de verrouillage séparé ; le lecteur du téléphone doit borner l'inflation skr+gzip comme le harnais (64 Mio) ; job de couverture et catégorie full_data_ à brancher dans la CI.
    Critère : chaque point fermé ou justifié, CI verte.

- key: X20
  title: "Mode libre limité aux packs installés"
  milestone: M3 Client v1
  labels: [client, carte]
  deps: [H2, K2]
  body: |
    Le mode libre n'affiche que les packs installés et un blanc neige couvre les zones sans tuiles ; la vue France du visualiseur n'a pas de fond de carte.
    Pistes de correction : fond de France très léger embarqué (bas zooms) ; emprises des packs disponibles dessinées ; téléchargement par zone d'un geste.
    Critère : navigation fluide sur toute la France sans pack, avec fond lisible.

- key: X21
  title: "Précalculs encore faits par le téléphone"
  milestone: M3 Client v1
  labels: [algo, pendant]
  deps: [E1]
  body: |
    Le téléphone calcule à l'ouverture les points des noms de pistes (~10 ms) et le dédoublonnage des refuges.
    Piste de correction : les précalculer dans le pack.
    Critère : ouverture d'un pack sans ce calcul, mesurée.

- key: X22
  title: "Domaines SRN sans tracé ouvert"
  milestone: M3 Client v1
  labels: [recherche, carte]
  deps: [G5]
  body: |
    Aucun tracé ouvert trouvé pour la Chartreuse, les crêtes des Vosges, l'Aubrac, le Cézallier, le Cantal, le Mont Lozère, les Glières ; 196 indices d'itinéraires sans tracé ; instances Geotrek illisibles (Lozère, Ariège, Hautes-Pyrénées, Volcans d'Auvergne, Monts d'Ardèche, Alpes-Maritimes, Serre-Ponçon, CD64) ; licences du PNR du Vercors et du GPX de la GTJ à confirmer.
    Pistes de correction : demandes aux parcs et départements (courriers types) ; zones propices calculées (pente, forêt, neige, accès) une fois le relief disponible ; contribution OSM des tracés publiés sous licence compatible.
    Critère : tracés ou zones propices pour chacun de ces massifs ; licences confirmées par écrit.

- key: X23
  title: "Préparer la publication sans fuite"
  milestone: M3 Client v1
  labels: [infra]
  deps: [O1, F2]
  body: |
    L'audit de fuites a trouvé du détail d'infra dans la documentation (registre, clusters, secrets, autre service, règles Cloudflare), le chemin /home/<utilisateur> dans l'historique, des commentaires d'issues (#50, #60, #85, #123), une dépendance au projet privé speak, et des objets git orphelins non élagués.
    Pistes de correction : déplacer le détail d'infra dans le dépôt d'infra privé ; réécriture d'historique en une passe (git filter-repo) ; supprimer et reposter les commentaires concernés ; rendre la génération de voix indépendante de speak (scripts dans le dépôt) ; git gc ; nouvel audit complet juste avant la publication.
    Critère : audit sans aucun point à corriger.

- key: X24
  title: "Site : cartes à régénérer et mode sombre"
  milestone: M3 Client v1
  labels: [client, carte]
  deps: [O1]
  body: |
    Les cartes du site viennent d'un pack antérieur à la mise à jour des pentes et restent claires en mode sombre.
    Piste de correction : régénérer juste avant publication avec les packs publics finaux, versions claire et sombre.
    Critère : cartes à jour et adaptées au thème.

- key: X25
  title: "Exposition aux avalanches trop lente pour 219 domaines"
  milestone: M3 Client v1
  labels: [algo, sécurité]
  deps: [P17, G2]
  body: |
    L'étape exposition aux avalanches domine build-all (81 à 324 s à Cervières selon la charge, 86 % du temps).
    Piste de correction : profiler le cas dominant ; parallélisme, tuiles, réutilisation entre domaines voisins ; calcul limité aux reliefs utiles.
    Critère : temps total des 219 domaines mesuré et divisé, résultats identiques.

- key: X26
  title: "Fond Plan IGN qui change à chaque reconstruction (mise à jour de 11 Mo)"
  milestone: M3 Client v1
  labels: [pipeline, carte]
  deps: [S0, P4]
  body: |
    Au déploiement du 15/11/2026, deux reconstructions successives du même site ont publié une mise à jour différentielle de 11 Mo au lieu de quelques centaines de Ko : la couche `plan-ign` change entre deux constructions.
    Pistes de correction : tuiles téléchargées figées par la date de la fiche IGNF_PLAN-IGN (ne retélécharger que si l'IGN publie une nouvelle version), écriture PMTiles déterministe (ordre et compression), comparaison par contenu avant publication.
    Critère : deux reconstructions sans nouvelle version IGN produisent une couche `plan-ign` identique à l'octet ; la synchro quotidienne revient sous 1 Mo.

- key: X27
  title: "Aucun cas particulier par site dans le code"
  milestone: M3 Client v1
  labels: [pipeline, infra]
  deps: [G2]
  body: |
    Règle de l'utilisateur : Cervières et Chapelle-des-Bois ne sont pas des cas spéciaux. Le code contient encore des noms de sites, des réglages, des fiches ou des chemins propres à ces deux sites (relevé du 15/11/2026, hors tests : common/site.rs, assist/crowd.rs et presets.rs, core/zone_eval.rs et ephemeris.rs, pisteplan/spec.rs, collect.rs et labels.rs, snow/stations.rs, ffi/catalog.rs, stations/titres.rs, zones/sources/gpu.rs, voice, osm/census.rs, meteo/hourly.rs, status/mairie.rs, cli, avalanche/exposure/build.rs, terrain).
    Correction : tout comportement vient des données de chaque site (registre, sources, emprise, massif) ou d'un calcul général ; aucune branche de code par nom de site. Les deux sites ne restent que comme jeux de test.
    Critère : `grep -riE "cervieres|chapelle"` hors tests, fixtures et docs ne renvoie rien ; résultats inchangés sur les deux sites ; un domaine quelconque se construit et se planifie de la même façon.
