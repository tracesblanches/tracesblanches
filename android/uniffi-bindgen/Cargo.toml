# UniFFI binding generator of the app (Gradle task `uniffiBindings`), host only. Outside the
# Cargo workspace: its build-time dependencies (askama...) are not those of the shipped
# library, and the workspace supply-chain checks (cargo deny) stay about what ships.
# The uniffi version must be the one of crates/ffi.
[package]
name = "skimap-uniffi-bindgen"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }
